name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # PyTorch só para CPU: bem menor e suficiente para os testes
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Estilo (ruff)
        run: ruff check .

      - name: Testes (pytest)
        run: pytest
