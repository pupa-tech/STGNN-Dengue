# O ponto warmup_cos já rodou na etapa 2 e é reaproveitado.
# Rode com:  python -m dengue.varredura configs/otimizacao/etapa3.yaml
base:
  etapa: etapa3
  modelo: stgcn
  grafo: geo
  passos: 920
  lote: 32
  clip: 5.0
  log_cada: 20
  seeds: [0]
grade:
  - {otimizador: adamw, lr: 0.1, agenda: [const, cos, warmup_cos, multistep]}
  - {otimizador: adam, lr: 0.03, agenda: [const, cos, warmup_cos, multistep]}
  - {otimizador: muon, lr: 0.01, agenda: [const, cos, warmup_cos, multistep]}
